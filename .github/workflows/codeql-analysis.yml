
name: "CodeQL"

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 8 * * 0'

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: 25

jobs:
  analyse:
    name: Analyse
    runs-on: windows-2022
    permissions:
      actions: read # Required for CodeQL to read the workflow run
      contents: read # Required for checkout
      security-events: write # Required for uploading the CodeQL results
    if: ${{ !(github.actor == 'dependabot[bot]' && contains(fromJSON('["push"]'), github.event_name)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: java
    - name: Build
      run: ./mvnw -B compile -DskipTests
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9